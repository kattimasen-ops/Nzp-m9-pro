name: Build NZP Engine (ARM64 Cross-Compile, GLIBC 2.31, KMSDRM)

on:
  workflow_dispatch:

jobs:
  build-arm64-cross:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Patch PR_SSQC_CheckHeaderCrc (CRC check disabled)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          [ -n "$PR_CMDS" ] || { echo "FEHLER: pr_cmds.c nicht gefunden"; exit 1; }
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          grep -A3 "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -10

      - name: Stage SDL2 KMSDRM patch script on host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"
          cat > "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py" << 'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          t = path.read_text()

          # Fix 1: Force SDL_WINDOW_OPENGL flag for Mali-G31 EGL
          marker = "NZP-M9-KMSDRM-WINDOW-FLAG"
          if marker not in t:
              pattern = re.compile(r"(KMSDRM_CreateWindow\s*\([^)]*\)\s*\{)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  insert = "\n    /* " + marker + " */\n    if (!(window->flags & SDL_WINDOW_VULKAN)) {\n        window->flags |= SDL_WINDOW_OPENGL;\n    }\n"
                  t = t[:m.end()] + insert + t[m.end():]
                  path.write_text(t)
                  print("OK: KMSDRM Window-Flag Patch angewendet.")
              else:
                  print("WARNUNG: KMSDRM_CreateWindow nicht gefunden.")

          # Fix 2: Pageflip Fallback (disable async flips if driver rejects them)
          t = path.read_text()
          marker2 = "NZP-M9-PAGEFLIP-FALLBACK"
          if marker2 not in t:
              pattern = re.compile(r"(ret = KMSDRM_drmModePageFlip\([^;]+;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  fallback = "\n    /* " + marker2 + " */\n    if (ret != 0 && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {\n        SDL_LogInfo(SDL_LOG_CATEGORY_VIDEO, \"Async pageflip rejected; using synchronous flips.\");\n        viddata->async_pageflip_support = SDL_FALSE;\n        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;\n        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);\n    }\n"
                  t = t[:m.end()] + fallback + t[m.end():]
                  path.write_text(t)
                  print("OK: Pageflip-Fallback eingefügt.")
              else:
                  print("WARNUNG: PageFlip-Aufruf nicht gefunden.")
          PYEOF

      - name: Build SDL2 with KMSDRM and cross-compile FTEQW
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py:/tmp/patch_kmsdrm.py:ro" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                build-essential make git pkg-config wget ca-certificates python3 \
                libdrm-dev libgbm-dev libgles2-mesa-dev libegl1-mesa-dev \
                libasound2-dev zlib1g-dev libpng-dev libjpeg-dev \
                libx11-dev libxext-dev libxss-dev libxcb1-dev \
                libxrandr-dev libxi-dev libxrender-dev libxtst-dev \
                libxt-dev libxfixes-dev libxcursor-dev libxinerama-dev

              # ── 1. SDL2 herunterladen ──
              SDL2_VER="2.30.7"
              cd /tmp
              wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
              tar xf "SDL2-${SDL2_VER}.tar.gz"
              cd "SDL2-${SDL2_VER}"

              # ── 2. SDL2 patchen (Script vom Host gemountet) ──
              python3 /tmp/patch_kmsdrm.py .

              # ── 3. SDL2 statisch mit KMSDRM kompilieren ──
              ./configure --prefix=/usr/local \
                --host=aarch64-linux-gnu \
                --enable-video-kmsdrm \
                --disable-video-x11 \
                --disable-video-wayland \
                --disable-video-vulkan \
                --enable-video-opengles \
                --disable-shared --enable-static
              make -j"$(nproc)"
              make install

              # ── 4. FTEQW bauen ──
              cd /workspace/engine

              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              export AR=aarch64-linux-gnu-ar
              export RANLIB=aarch64-linux-gnu-ranlib
              export STRIP=aarch64-linux-gnu-strip
              export PKG_CONFIG_LIBDIR=/workspace/engine/libs-aarch64-linux-gnu
              export PKG_CONFIG_SYSROOT_DIR=/workspace/engine/libs-aarch64-linux-gnu

              OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -funsafe-math-optimizations -fno-math-errno -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe"

              mkdir -p libs-aarch64-linux-gnu
              cp /usr/local/lib/libSDL2.a libs-aarch64-linux-gnu/
              cp -r /usr/local/include/SDL2 libs-aarch64-linux-gnu/

              echo "=== Dependencies bauen (makelibs) ==="
              time make makelibs FTE_TARGET=linux_arm64

              echo "=== Engine cross-kompilieren ==="
              time make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                NO_X11=1 \
                CC="${CC}" \
                CXX="${CXX}" \
                CPUOPTIMIZATIONS="${OPT_FLAGS}" \
                -j"$(nproc)"
            '

      - name: Verify Binary (fail with diagnostics)
        run: |
          set -euo pipefail
          BIN=$(find engine/release -maxdepth 1 -type f \
            \( -name "nzportablearm64" \
               -o -name "nzportable*" \
               -o -name "nzp.aarch64" \
               -o -name "nzp-sdl" \) 2>/dev/null \
            | grep -v '\.db$' | head -1)

          if [ -z "$BIN" ]; then
            echo "::error::Binary nicht gefunden. Inhalt von engine/release:"
            find engine/release -maxdepth 1 -type f -printf '%f\n' || true
            echo "::error::Prüfe den Docker-Build-Output oben auf Compiler-Fehler."
            exit 1
          fi

          file "$BIN"
          if ! file "$BIN" | grep -q "ARM aarch64"; then
            echo "::error::Binary ist NICHT ARM64: $BIN"
            exit 1
          fi
          echo "OK: Binary ist ARM64"
          echo "=== GLIBC-Version der Binary ==="
          readelf --version-info "$BIN" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -u || true
