name: Build NZP Complete PortMaster Package (RK3326 / ArkOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Compile FTE Engine & QuakeC Code in ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace \
            arm64v8/ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update && apt-get install -y --no-install-recommends \
                build-essential make git curl wget ca-certificates pkg-config perl \
                libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libasound2-dev zlib1g-dev

              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "*"

              # 1. Compile FTE Engine Binary
              cd engine
              make makelibs FTE_TARGET=linux_arm64
              make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                NO_X11=1 \
                NO_WAYLAND=1 \
                NO_VULKAN=1 \
                CPUOPTIMIZATIONS="-O2 -march=armv8-a -mtune=cortex-a35 -pipe" \
                -j"$(nproc)"
              cd ..

              # 2. Compile QuakeC Code (progs.dat / menu.dat) if FTEqcc exists
              if [ -d "code" ] || [ -d "src" ]; then
                echo "Building updated QuakeC game bytecode..."
                make progs || make qc || true
              fi
            '

      - name: Stage Complete PortMaster Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/nzp

          # Copy Engine Binary
          BIN=$(find engine -maxdepth 4 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" | head -n1)

          if [ -z "${BIN}" ]; then
            echo "Error: Engine binary not found!" && exit 1
          fi

          cp "${BIN}" dist/nzp/nzp.aarch64
          chmod +x dist/nzp/nzp.aarch64

          # Copy Compiled QuakeC Bytecode Data Files (if present)
          find . -maxdepth 3 \( -name "progs.dat" -o -name "menu.dat" -o -name "csprogs.dat" \) \
            -exec cp {} dist/nzp/ \;

          echo "Final Package Contents:"
          ls -la dist/nzp/

      - name: Upload PortMaster Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-m9pro-portmaster-complete
          path: dist/nzp/
          if-no-files-found: error
