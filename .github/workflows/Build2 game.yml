name: bau NZP AArch64 PortMaster Build (RK3326)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FTE_TARGET: linux_arm64
  FTE_CONFIG: nzportable
  # Harte 64-Bit RK3326 (Cortex-A35) Optimierungen
  CPU_FLAGS: "-O3 -march=armv8-a+crc -mtune=cortex-a35 -ftree-vectorize -pipe"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout nzp-team/fteqw (Die offizielle Engine-Quelle)
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          submodules: recursive

      - name: Cross-Build im Ubuntu 20.04 Container (glibc-Kompatibilität)
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e FTE_TARGET="${FTE_TARGET}" -e FTE_CONFIG="${FTE_CONFIG}" -e CPU_FLAGS="${CPU_FLAGS}" \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "===== Konfiguriere ARM64 Quellen (Ubuntu 20.04 / focal) ====="
              dpkg --add-architecture arm64
              cp /etc/apt/sources.list /etc/apt/sources.list.bak
              cat > /etc/apt/sources.list << EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-security main restricted universe multiverse
          
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ focal-security main restricted universe multiverse
          EOF

              for i in 1 2 3; do
                apt-get update && break
                echo "apt-get update fehlgeschlagen, Versuch $i/3 ..."
                sleep 5
              done

              echo "===== Installiere 64-Bit Toolchain und SDL2 Abhängigkeiten ====="
              apt-get install -y --no-install-recommends \
                build-essential make git curl wget ca-certificates pkg-config perl \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                libsdl2-dev:arm64 libsdl2-mixer-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 \
                libgl1-mesa-dev:arm64 libx11-dev:arm64 libcurl4-openssl-dev:arm64 zlib1g-dev:arm64

              echo "===== Git safe.directory Ausnahme ====="
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "*"

              cd engine

              echo "===== make makelibs (Integriert zlib, libpng, libjpeg, libvorbis) ====="
              make makelibs FTE_TARGET=${FTE_TARGET}

              echo "===== Eigentlicher Build mit Cortex-A35 Optimierungen ====="
              set -x
              make m-rel FTE_TARGET=${FTE_TARGET} FTE_CONFIG=${FTE_CONFIG} \
                CPUOPTIMIZATIONS="${CPU_FLAGS}" -j"$(nproc)"
              set +x
            '

      - name: Finde und benenne das fertige Binary um
        run: |
          set -euo pipefail
          mkdir -p dist/nzportable

          # Sucht verlässlich nach der generierten ARM64 Datei
          BIN=$(find engine -maxdepth 4 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" | head -n1)

          if [ -z "${BIN}" ]; then
            echo "::error::Keine arm64-Binary gefunden!"
            exit 1
          fi

          echo "Gefunden: ${BIN}"
          file "${BIN}"
          if ! file "${BIN}" | grep -qi "ARM aarch64"; then
            echo "::error::Binary ist nicht für AArch64 gebaut!"
            exit 1
          fi
          
          # Umbenennung für direkte PortMaster-Kompatibilität auf dem M9 Pro
          cp "${BIN}" dist/nzportable/nzp-aarch64-sdl

      - name: Upload als PortMaster Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: nzp-m9pro-aarch64-optimized
          path: dist/nzportable/
          if-no-files-found: error
