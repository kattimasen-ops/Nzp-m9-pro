name: Build NZP M9 Pro (ARM64) with Patches

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FTEQW Engine
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Checkout QuakeC Source (NZP)
        uses: actions/checkout@v4
        with:
          repository: kattimasen-ops/Nzp-m9-pro
          path: quakec-src
          fetch-depth: 1

      - name: Install Cross-Compilation Dependencies (ARM64)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # Use ports.ubuntu.com for ARM64 packages
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            make pkg-config \
            libgl-dev:arm64 libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
            libglx-dev:arm64 libgl1-mesa-dev:arm64 \
            libpng-dev:arm64 libjpeg-dev:arm64 zlib1g-dev:arm64 \
            libasound2-dev:arm64 libpulse-dev:arm64

      - name: Patch PR_SSQC_CheckHeaderCrc (Bypass CRC Check)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          if [ -z "$PR_CMDS" ]; then
            echo "FEHLER: pr_cmds.c nicht gefunden!"
            exit 1
          fi
          echo "Patche $PR_CMDS"
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          echo "=== Gepatchte Funktion ==="
          grep -A3 "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -20

      - name: Configure Environment and Patch Makefile for EGL Backend
        run: |
          set -euo pipefail
          cd engine

          # --- 1. Patch Makefile to force-include gl_videgl.o in MCL_OBJS ---
          # The previous linker error showed 'eglrendererinfo' and 'GLVID_*' were missing.
          # These are provided by gl_videgl.c. We append it to MCL_OBJS.
          if ! grep -q "gl_videgl.o" Makefile; then
            echo "Füge gl_videgl.o zu MCL_OBJS hinzu..."
            # Check if MCL_OBJS exists and append. Otherwise, append to GLCL_OBJS as fallback.
            if grep -q "^MCL_OBJS=" Makefile; then
              sed -i '/^MCL_OBJS=/s/$/ gl_videgl.o/' Makefile
            elif grep -q "^GLCL_OBJS=" Makefile; then
              sed -i '/^GLCL_OBJS=/s/$/ gl_videgl.o/' Makefile
            else
              echo "WARNUNG: MCL_OBJS oder GLCL_OBJS nicht gefunden. Versuche globales OBJS."
              # Fallback: Try appending to a generic OBJS variable if it exists
              if grep -q "^OBJS=" Makefile; then
                sed -i '/^OBJS=/s/$/ gl_videgl.o/' Makefile
              fi
            fi
          else
            echo "gl_videgl.o ist bereits in der Makefile referenziert."
          fi

          # Optional: Ensure -DUSE_EGL is defined for the EGL backend
          if ! grep -q "USE_EGL" Makefile; then
            echo "Füge -DUSE_EGL zu GL_CFLAGS hinzu..."
            # Find the GL_CFLAGS line and append -DUSE_EGL
            if grep -q "^GL_CFLAGS" Makefile; then
              sed -i '/^GL_CFLAGS/s/$/ -DUSE_EGL/' Makefile
            fi
          fi

          # --- 2. Set Compiler and Optimization Flags ---
          # WICHTIG: -DNO_X11 bleibt, aber -DUSE_EGL wird hinzugefügt.
          # ALSA wird NICHT deaktiviert (-DNO_ALSA fehlt absichtlich).
          export OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -DNO_X11 -DUSE_EGL \
            -fno-strict-aliasing -fno-finite-math-only \
            -fomit-frame-pointer -funroll-loops -pipe"

          export CC=aarch64-linux-gnu-gcc
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/

          # --- 3. Build Libraries (makelibs) ---
          # This MUST succeed (no '|| true') for ARM64 static libs to be present.
          make makelibs FTE_TARGET=linux_arm64

          # --- 4. Build the Engine ---
          # Note: We still pass NO_X11=1 as a make variable, but the -DUSE_EGL flag
          # and the Makefile patch should ensure the EGL backend is compiled.
          make m-rel \
            FTE_TARGET=linux_arm64 \
            FTE_CONFIG=nzportable \
            CC=aarch64-linux-gnu-gcc \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            USE_SDL=2 \
            NO_X11=1 \
            NO_WAYLAND=1 \
            NO_VULKAN=1 \
            -j"$(nproc)"

      - name: Verify Output Binary
        run: |
          set -euo pipefail
          BINARY="engine/release/nzportablearm64.db"
          if [ -f "$BINARY" ]; then
            echo "✅ Build successful: $BINARY"
            file "$BINARY"
            ls -lh "$BINARY"
          else
            echo "❌ Build failed: Binary not found at $BINARY"
            # List release directory to help debugging
            ls -la engine/release/ || true
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-arm64-binary
          path: engine/release/nzportablearm64.db
          if-no-files-found: error
