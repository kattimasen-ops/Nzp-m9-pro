name: build-rk3326

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/*.yml'

jobs:
  build-rk3326:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout FTEQW
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Patch pr_cmds.c (CRC-Check deaktivieren)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          [ -n "$PR_CMDS" ] || { echo "FEHLER: pr_cmds.c nicht gefunden"; exit 1; }
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          grep -A2 -n "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -5 || true

      - name: Patch-Scripts und Build-Script auf Host schreiben
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"

          cat > "$RUNNER_TEMP/nzp-build/patch_makefile.py" << 'PYEOF'
          import sys, pathlib

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text().splitlines()

          # 1) gl_vidlinuxglx.o überall durch gl_vidsdl.o ersetzen
          lines = [line.replace("gl_vidlinuxglx.o", "gl_vidsdl.o") for line in lines]

          # 2) GLCFLAGS um -DEGLQUAKE erweitern (für gl_videgl.o)
          for i, line in enumerate(lines):
              if line.startswith("GLCFLAGS?=") and "EGLQUAKE" not in line:
                  lines[i] = line.rstrip() + " -DEGLQUAKE"
                  print(f"GLCFLAGS[{i+1}] um -DEGLQUAKE erweitert: {lines[i]}")

          # 3) Sicherstellen, dass MCL_OBJS für linux gl_videgl.o enthält
          for i, line in enumerate(lines):
              if line.startswith("MCL_OBJS=") and "$(SOFTWARE_OBJS)" in line and "gl_videgl.o" not in line:
                  prefix, rest = line.split("=", 1)
                  lines[i] = prefix + "=" + rest + " gl_videgl.o"
                  print(f"MCL_OBJS[{i+1}] um gl_videgl.o erweitert")

          path.write_text("\n".join(lines) + "\n")
          print("Makefile-Patch abgeschlossen.")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py" << 'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          t = path.read_text()

          marker = "NZP-M9-KMSDRM-WINDOW-FLAG"
          if marker not in t:
              pattern = re.compile(r"(window->driverdata\s*=\s*windata\s*;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  insert = (
                      "    /* " + marker + " */\n"
                      "    if (!(window->flags & SDL_WINDOW_VULKAN)) {\n"
                      "        window->flags |= SDL_WINDOW_OPENGL;\n"
                      "    }\n\n"
                  )
                  t = t[:m.start()] + insert + t[m.start():]
                  path.write_text(t)
                  print("OK: KMSDRM Window-Flag Patch angewendet.")
              else:
                  print("WARNUNG: window->driverdata = windata; nicht gefunden.")

          t = path.read_text()
          marker2 = "NZP-M9-PAGEFLIP-FALLBACK"
          if marker2 not in t:
              pattern = re.compile(r"(KMSDRM_drmModePageFlip\s*\([^;]+;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  fallback = (
                      "\n    /* " + marker2 + " */\n"
                      "    if (ret != 0 && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {\n"
                      "        SDL_LogInfo(SDL_LOG_CATEGORY_VIDEO, \"Async pageflip rejected; using synchronous flips.\");\n"
                      "        viddata->async_pageflip_support = SDL_FALSE;\n"
                      "        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;\n"
                      "        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);\n"
                      "    }\n"
                  )
                  t = t[:m.end()] + fallback + t[m.end():]
                  path.write_text(t)
                  print("OK: Pageflip-Fallback eingefügt.")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_glvidsdl.py" << 'PYEOF'
          import sys, pathlib

          path = pathlib.Path(sys.argv[1] + "/gl/gl_vidsdl.c")
          t = path.read_text()

          if "GLVID_GetRGBInfo" not in t:
              stub = r'''

/* NZP-M9: GLVID_GetRGBInfo wird von gl_vidcommon.o und gl_videgl.o benötigt.
 * gl_vidsdl.c definiert diese Funktion nicht, da sie nur für Screenshots/Video
 * in den X11/Windows-Treibern vorhanden ist. Implementierung via glReadPixels,
 * damit die Funktionalität (Screenshot) erhalten bleibt. */
#ifdef USE_SDL
#ifndef GLVID_GetRGBInfo
char *GLVID_GetRGBInfo(int *truewidth, int *trueheight, enum uploadfmt *fmt)
{
    extern int vid_width, vid_height;
    int w = vid_width;
    int h = vid_height;
    unsigned char *buf;
    int y;

    if (w <= 0 || h <= 0)
        return NULL;

    buf = (unsigned char *)malloc((size_t)w * (size_t)h * 4);
    if (!buf)
        return NULL;

    glPixelStorei(GL_PACK_ALIGNMENT, 1);
    glReadPixels(0, 0, w, h, GL_RGBA, GL_UNSIGNED_BYTE, buf);

    /* OpenGL liefert von unten nach oben – für Screenshots umdrehen. */
    {
        unsigned char *tmp = (unsigned char *)malloc((size_t)w * 4);
        if (tmp) {
            for (y = 0; y < h / 2; y++) {
                unsigned char *a = buf + (size_t)y * w * 4;
                unsigned char *b = buf + (size_t)(h - 1 - y) * w * 4;
                memcpy(tmp, a, (size_t)w * 4);
                memcpy(a, b, (size_t)w * 4);
                memcpy(b, tmp, (size_t)w * 4);
            }
            free(tmp);
        }
    }

    if (truewidth) *truewidth = w;
    if (trueheight) *trueheight = h;
    if (fmt) *fmt = PTI_RGBA8;
    return (char *)buf;
}
#endif
#endif
'''
              path.write_text(t + stub)
              print("OK: GLVID_GetRGBInfo in gl_vidsdl.c eingefügt.")
          else:
              print("GLVID_GetRGBInfo bereits vorhanden.")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/build.sh" << 'BUILDEOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          dpkg --add-architecture arm64
          sed -i "s|^deb |deb [arch=amd64] |" /etc/apt/sources.list
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse"
          } > /etc/apt/sources.list.d/arm64-ports.list

          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential make git pkg-config wget ca-certificates python3

          git config --global --add safe.directory /workspace

          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
            libasound2-dev:arm64 zlib1g-dev:arm64 libpng-dev:arm64 libjpeg-dev:arm64 \
            libxss-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 libxext-dev:arm64

          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/

          SDL2_VER="2.30.7"
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
          tar xf "SDL2-${SDL2_VER}.tar.gz"
          cd "SDL2-${SDL2_VER}"
          python3 /tmp/patch_kmsdrm.py .

          CFLAGS="-fPIC -Wno-declaration-after-statement" \
          LDFLAGS="-L/usr/lib/aarch64-linux-gnu" \
          ./configure --prefix=/usr/local --host=aarch64-linux-gnu \
            --enable-video-kmsdrm --disable-video-x11 --disable-video-wayland \
            --disable-video-vulkan --enable-video-opengles --enable-shared --disable-static
          make -j"$(nproc)"
          make install

          if [ ! -d /usr/local/include/SDL2 ] || [ -z "$(ls -A /usr/local/include/SDL2 2>/dev/null)" ]; then
            echo "FATAL: /usr/local/include/SDL2 fehlt oder leer"; exit 1
          fi

          for f in /usr/local/lib/libSDL2-2.0.so.0 /usr/local/lib/libSDL2-2.0.so; do
            [ -e "$f" ] && ln -sf "$f" /usr/local/lib/libSDL2.so && break
          done

          cd /workspace/engine
          export CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib STRIP=aarch64-linux-gnu-strip
          export PKGCONFIG=/usr/bin/aarch64-linux-gnu-pkg-config
          export SDLCONFIG=/usr/local/bin/sdl2-config
          export SDLLIBS="-L/usr/local/lib -lSDL2"
          export SDLCFLAGS="-I/usr/local/include/SDL2 -D_REENTRANT -DUSE_SDL=2 -DEGLQUAKE"

          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -funsafe-math-optimizations -fno-math-errno \
            -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe \
            -DNO_X11 -DUSE_SDL=2 -DEGLQUAKE"

          mkdir -p libs-aarch64-linux-gnu/SDL2
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/SDL2/

          echo "=== Patch gl_vidsdl.c: GLVID_GetRGBInfo ==="
          python3 /tmp/patch_glvidsdl.py /workspace/engine
          grep -n "GLVID_GetRGBInfo" /workspace/engine/gl/gl_vidsdl.c | head -3

          echo "=== Makefile patchen ==="
          python3 /tmp/patch_makefile.py /workspace/engine/Makefile

          echo "=== Verifikation: gl_vidlinuxglx.o darf nicht mehr vorkommen ==="
          if grep -n "gl_vidlinuxglx.o" /workspace/engine/Makefile; then
            echo "FATAL: gl_vidlinuxglx.o ist noch im Makefile!"; exit 1
          fi
          echo "OK: gl_vidlinuxglx.o vollständig ersetzt."

          echo "=== GLCFLAGS-Zeile nach Patch ==="
          grep -n "^GLCFLAGS" /workspace/engine/Makefile | head -3

          echo "=== MCL_OBJS-Zeilen nach Patch ==="
          grep -n "^MCL_OBJS=" /workspace/engine/Makefile | head -5

          echo "=== Dependencies bauen (makelibs) ==="
          time make makelibs FTE_TARGET=linux_arm64

          echo "=== Engine-Objekte löschen ==="
          rm -rf /workspace/engine/release/m_linuxarm64

          echo "=== Engine cross-kompilieren ==="
          set +e
          time make m-rel FTE_TARGET=linux_arm64 FTE_CONFIG=nzportable USE_SDL=2 SDL=2 NO_X11=1 \
            CC="${CC}" CXX="${CXX}" PKGCONFIG="${PKGCONFIG}" \
            SDLCONFIG="${SDLCONFIG}" SDLLIBS="${SDLLIBS}" SDLCFLAGS="${SDLCFLAGS}" \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            LDFLAGS="-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib -lSDL2" -j"$(nproc)"
          BUILD_RC=$?
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "=== LINK FEHLGESCHLAGEN (RC=$BUILD_RC) — Diagnose ==="
            echo "--- Vorhandene Videobjekte ---"
            find /workspace/engine \( -name 'gl_vidsdl.o' -o -name 'gl_videgl.o' \) -print 2>/dev/null
            for f in $(find /workspace/engine \( -name 'gl_vidsdl.o' -o -name 'gl_videgl.o' \) -print 2>/dev/null); do
              echo "--- $f ---"
              aarch64-linux-gnu-nm "$f" 2>/dev/null | grep -E "GLVID_|eglrendererinfo" || echo "(keine Treffer)"
            done
            echo "--- gl_vidcommon.o Referenzen ---"
            aarch64-linux-gnu-nm /workspace/engine/release/m_linuxarm64/gl_vidcommon.o 2>/dev/null | grep -E "GLVID_" || true
            echo "--- gl_vidsdl.c: GLVID_GetRGBInfo ---"
            grep -n "GLVID_GetRGBInfo" /workspace/engine/gl/gl_vidsdl.c | head -5 || true
            exit 1
          fi

          mkdir -p /workspace/engine/release
          cp -a /usr/local/lib/libSDL2-2.0.so* /workspace/engine/release/ || true
          cp -a /usr/local/lib/libSDL2.so  /workspace/engine/release/ || true
          cd /workspace/engine/release
          ln -sf libSDL2-2.0.so.0 libSDL2-2.0.so || true
          echo "=== Patch-Marker in libSDL2-2.0.so.0 ==="
          strings libSDL2-2.0.so.0 | grep "NZP-M9" || echo "WARNUNG: Patch-Marker nicht gefunden!"
          BUILDEOF

      - name: Cross-Compile in ubuntu:20.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py:/tmp/patch_kmsdrm.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_makefile.py:/tmp/patch_makefile.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_glvidsdl.py:/tmp/patch_glvidsdl.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/build.sh:/tmp/build.sh:ro" \
            -w /workspace \
            ubuntu:20.04 bash /tmp/build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-rk3326-kmsdrm
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/libSDL2-2.0.so.0
            engine/release/libSDL2-2.0.so
          if-no-files-found: error
