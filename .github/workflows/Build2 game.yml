name: build-rk3326

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/*.yml'

jobs:
  build-rk3326:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout FTEQW
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Patch pr_cmds.c (CRC-Check deaktivieren)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          [ -n "$PR_CMDS" ] || { echo "FEHLER: pr_cmds.c nicht gefunden"; exit 1; }
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          grep -A2 -n "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -5 || true

      - name: Makefile-Patch-Script auf Host schreiben
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"
          cat > "$RUNNER_TEMP/nzp-build/patch_makefile.py" << 'PYEOF'
          import sys, pathlib

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text().splitlines()
          order = ["gl_vidsdl.o", "gl_videgl.o", "in_sdl.o", "sys_sdl.o"]

          for i, line in enumerate(lines):
              if line.startswith("GLCL_OBJS="):
                  prefix, rest = line.split("=", 1)
                  tokens = rest.split()
                  tokens = ["gl_vidsdl.o" if x == "gl_vidlinuxglx.o" else x for x in tokens]
                  tokens = [x for x in tokens if x not in order]
                  tokens.extend(order)
                  lines[i] = prefix + "=" + " ".join(tokens)
                  print(f"GLCL_OBJS[{i+1}]={lines[i]}")
                  break
          else:
              print("FEHLER: GLCL_OBJS= nicht gefunden")
              sys.exit(1)

          path.write_text("\n".join(lines) + "\n")
          PYEOF

      - name: KMSDRM Patch-Script auf Host schreiben
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"
          cat > "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py" << 'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          t = path.read_text()

          marker = "NZP-M9-KMSDRM-WINDOW-FLAG"
          if marker not in t:
              pattern = re.compile(r"(window->driverdata\s*=\s*windata\s*;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  insert = (
                      "    /* " + marker + " */\n"
                      "    if (!(window->flags & SDL_WINDOW_VULKAN)) {\n"
                      "        window->flags |= SDL_WINDOW_OPENGL;\n"
                      "    }\n\n"
                  )
                  t = t[:m.start()] + insert + t[m.start():]
                  path.write_text(t)
                  print("OK: KMSDRM Window-Flag Patch angewendet.")
              else:
                  print("WARNUNG: window->driverdata = windata; nicht gefunden.")

          t = path.read_text()
          marker2 = "NZP-M9-PAGEFLIP-FALLBACK"
          if marker2 not in t:
              pattern = re.compile(r"(KMSDRM_drmModePageFlip\s*\([^;]+;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  fallback = (
                      "\n    /* " + marker2 + " */\n"
                      "    if (ret != 0 && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {\n"
                      "        SDL_LogInfo(SDL_LOG_CATEGORY_VIDEO, \"Async pageflip rejected; using synchronous flips.\");\n"
                      "        viddata->async_pageflip_support = SDL_FALSE;\n"
                      "        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;\n"
                      "        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);\n"
                      "    }\n"
                  )
                  t = t[:m.end()] + fallback + t[m.end():]
                  path.write_text(t)
                  print("OK: Pageflip-Fallback eingefügt.")
          PYEOF

      - name: Cross-Compile in ubuntu:20.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py:/tmp/patch_kmsdrm.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_makefile.py:/tmp/patch_makefile.py:ro" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              dpkg --add-architecture arm64
              sed -i "s|^deb |deb [arch=amd64] |" /etc/apt/sources.list
              {
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse"
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse"
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse"
              } > /etc/apt/sources.list.d/arm64-ports.list

              apt-get update

              apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                build-essential make git pkg-config wget ca-certificates python3

              git config --global --add safe.directory /workspace

              apt-get install -y --no-install-recommends \
                libdrm-dev:arm64 libgbm-dev:arm64 \
                libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
                libasound2-dev:arm64 zlib1g-dev:arm64 \
                libpng-dev:arm64 libjpeg-dev:arm64 \
                libxss-dev:arm64 libxrandr-dev:arm64 \
                libxi-dev:arm64 libxext-dev:arm64

              export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_LIBDIR=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_SYSROOT_DIR=/

              SDL2_VER="2.30.7"
              cd /tmp
              wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
              tar xf "SDL2-${SDL2_VER}.tar.gz"
              cd "SDL2-${SDL2_VER}"
              python3 /tmp/patch_kmsdrm.py .

              CFLAGS="-fPIC -Wno-declaration-after-statement" \
              LDFLAGS="-L/usr/lib/aarch64-linux-gnu" \
              ./configure --prefix=/usr/local \
                --host=aarch64-linux-gnu \
                --enable-video-kmsdrm \
                --disable-video-x11 \
                --disable-video-wayland \
                --disable-video-vulkan \
                --enable-video-opengles \
                --enable-shared --disable-static
              make -j"$(nproc)"
              make install

              echo "=== /usr/local/include/SDL2/ (erste 15) ==="
              ls -la /usr/local/include/SDL2/ | head -15 || true

              if [ ! -d /usr/local/include/SDL2 ] || [ -z "$(ls -A /usr/local/include/SDL2 2>/dev/null)" ]; then
                echo "FATAL: /usr/local/include/SDL2 fehlt oder leer"
                exit 1
              fi

              for f in /usr/local/lib/libSDL2-2.0.so.0 /usr/local/lib/libSDL2-2.0.so; do
                [ -e "$f" ] && ln -sf "$f" /usr/local/lib/libSDL2.so && break
              done
              ls -la /usr/local/lib/libSDL2* || true

              echo "=== sdl2-config --libs ==="
              /usr/local/bin/sdl2-config --libs || true
              echo "=== pkg-config sdl2 ==="
              /usr/bin/aarch64-linux-gnu-pkg-config --cflags --libs sdl2 || true

              cd /workspace/engine

              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              export AR=aarch64-linux-gnu-ar
              export RANLIB=aarch64-linux-gnu-ranlib
              export STRIP=aarch64-linux-gnu-strip
              export PKGCONFIG=/usr/bin/aarch64-linux-gnu-pkg-config

              export SDLCONFIG=/usr/local/bin/sdl2-config
              export SDLLIBS="-L/usr/local/lib -lSDL2"
              export SDLCFLAGS="-I/usr/local/include/SDL2 -D_REENTRANT -DUSE_SDL=2"

              OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
                -funsafe-math-optimizations -fno-math-errno \
                -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe \
                -DNO_X11 -DUSE_SDL=2"

              mkdir -p libs-aarch64-linux-gnu/SDL2
              cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/
              cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/SDL2/

              echo "=== Verifikation Header-Kopie ==="
              ls -la libs-aarch64-linux-gnu/SDL.h libs-aarch64-linux-gnu/SDL2/SDL.h

              echo "=== Makefile patchen: GLCL_OBJS ==="
              python3 /tmp/patch_makefile.py /workspace/engine/Makefile
              grep -n "^GLCL_OBJS=" /workspace/engine/Makefile | head -1
              grep -n "^GLCL_OBJS=" /workspace/engine/Makefile | head -1 | grep "gl_videgl.o" || { echo "FATAL: gl_videgl.o fehlt in GLCL_OBJS"; exit 1; }
              grep -n "^GLCL_OBJS=" /workspace/engine/Makefile | head -1 | grep "in_sdl.o" || { echo "FATAL: in_sdl.o fehlt in GLCL_OBJS"; exit 1; }
              grep -n "^GLCL_OBJS=" /workspace/engine/Makefile | head -1 | grep "sys_sdl.o" || { echo "FATAL: sys_sdl.o fehlt in GLCL_OBJS"; exit 1; }

              echo "=== Dependencies bauen (makelibs) ==="
              time make makelibs FTE_TARGET=linux_arm64

              echo "=== Engine-Objekte alt löschen, damit USE_SDL=2 sicher greift ==="
              rm -rf /workspace/engine/release/m_linuxarm64

              echo "=== Engine cross-kompilieren (RK3326, KMSDRM, SDL2) ==="
              if ! time make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                SDL=2 \
                NO_X11=1 \
                CC="${CC}" \
                CXX="${CXX}" \
                PKGCONFIG="${PKGCONFIG}" \
                SDLCONFIG="${SDLCONFIG}" \
                SDLLIBS="${SDLLIBS}" \
                SDLCFLAGS="${SDLCFLAGS}" \
                CPUOPTIMIZATIONS="${OPT_FLAGS}" \
                LDFLAGS="-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib -lSDL2" \
                -j"$(nproc)"; then
                echo "=== LINK FEHLGESCHLAGEN — nm-Diagnose ==="
                echo "--- in_sdl.o ---"
                aarch64-linux-gnu-nm /workspace/engine/release/m_linuxarm64/in_sdl.o | grep -E "INS_Init|INS_Commands|INS_SetOSK" || true
                echo "--- sys_sdl.o ---"
                aarch64-linux-gnu-nm /workspace/engine/release/m_linuxarm64/sys_sdl.o | grep -E "Sys_SendKeyEvents" || true
                echo "--- gl_videgl.o ---"
                aarch64-linux-gnu-nm /workspace/engine/release/m_linuxarm64/gl_videgl.o | grep -E "eglrendererinfo" || true
                echo "--- gl_vidsdl.o ---"
                aarch64-linux-gnu-nm /workspace/engine/release/m_linuxarm64/gl_vidsdl.o | grep -E "IN_ActivateMouse|IN_DeactivateMouse|mouseactive" || true
                exit 1
              fi

              mkdir -p /workspace/engine/release
              cp -a /usr/local/lib/libSDL2-2.0.so* /workspace/engine/release/ || true
              cp -a /usr/local/lib/libSDL2.so  /workspace/engine/release/ || true
              cd /workspace/engine/release
              ln -sf libSDL2-2.0.so.0 libSDL2-2.0.so || true

              echo "=== Patch-Marker in libSDL2-2.0.so.0 ==="
              strings libSDL2-2.0.so.0 | grep "NZP-M9" || echo "WARNUNG: Patch-Marker nicht gefunden!"
            '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-rk3326-kmsdrm
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/libSDL2-2.0.so.0
            engine/release/libSDL2-2.0.so
          if-no-files-found: error
