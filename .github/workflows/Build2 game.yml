name: Build NZP Engine (RK3326 ARM64, KMSDRM, SDL2)

on:
  workflow_dispatch:

jobs:
  build-rk3326:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Patch PR_SSQC_CheckHeaderCrc (CRC check disabled)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          [ -n "$PR_CMDS" ] || { echo "FEHLER: pr_cmds.c nicht gefunden"; exit 1; }
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"

      - name: Patch Makefile to use SDL video for merged client
        run: |
          set -euo pipefail
          MAKEFILE=$(find . -path "*/engine/Makefile" | head -n 1)
          [ -n "$MAKEFILE" ] || { echo "FEHLER: engine/Makefile nicht gefunden"; exit 1; }

          # In GLCL_OBJS steht gl_vidlinuxglx.o. Mit -DNO_X11 liefert diese
          # Datei keine GLVID_*-Implementierung. Ersetze sie durch gl_vidsdl.o.
          sed -i 's/gl_vidlinuxglx\.o/gl_vidsdl.o/g' "$MAKEFILE"

          echo "=== GLCL_OBJS-Zeile nach Patch ==="
          grep -n "GLCL_OBJS=" "$MAKEFILE" | head -3

      - name: Stage SDL2 KMSDRM patch script on host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"
          cat > "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py" << 'PYEOF'
          import sys, re, pathlib

          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          t = path.read_text()

          marker = "NZP-M9-KMSDRM-WINDOW-FLAG"
          if marker not in t:
              pattern = re.compile(r"(window->driverdata\s*=\s*windata\s*;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  insert = (
                      "    /* " + marker + " */\n"
                      "    if (!(window->flags & SDL_WINDOW_VULKAN)) {\n"
                      "        window->flags |= SDL_WINDOW_OPENGL;\n"
                      "    }\n\n"
                  )
                  t = t[:m.start()] + insert + t[m.start():]
                  path.write_text(t)
                  print("OK: KMSDRM Window-Flag Patch angewendet.")
              else:
                  print("WARNUNG: window->driverdata = windata; nicht gefunden.")

          t = path.read_text()
          marker2 = "NZP-M9-PAGEFLIP-FALLBACK"
          if marker2 not in t:
              pattern = re.compile(r"(KMSDRM_drmModePageFlip\s*\([^;]+;)", re.DOTALL)
              m = pattern.search(t)
              if m:
                  fallback = (
                      "\n    /* " + marker2 + " */\n"
                      "    if (ret != 0 && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {\n"
                      "        SDL_LogInfo(SDL_LOG_CATEGORY_VIDEO, \"Async pageflip rejected; using synchronous flips.\");\n"
                      "        viddata->async_pageflip_support = SDL_FALSE;\n"
                      "        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;\n"
                      "        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);\n"
                      "    }\n"
                  )
                  t = t[:m.end()] + fallback + t[m.end():]
                  path.write_text(t)
                  print("OK: Pageflip-Fallback eingefügt.")
          PYEOF

      - name: Build RK3326-optimized SDL2 and FTEQW
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_kmsdrm.py:/tmp/patch_kmsdrm.py:ro" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              dpkg --add-architecture arm64
              sed -i "s|^deb |deb [arch=amd64] |" /etc/apt/sources.list
              {
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse"
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse"
                echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse"
              } > /etc/apt/sources.list.d/arm64-ports.list

              apt-get update

              apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                binutils-aarch64-linux-gnu \
                build-essential make git pkg-config wget ca-certificates python3

              git config --global --add safe.directory /workspace

              apt-get install -y --no-install-recommends \
                libdrm-dev:arm64 libgbm-dev:arm64 \
                libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
                libasound2-dev:arm64 zlib1g-dev:arm64 \
                libpng-dev:arm64 libjpeg-dev:arm64 \
                libxss-dev:arm64 libxrandr-dev:arm64 \
                libxi-dev:arm64 libxext-dev:arm64

              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_SYSROOT_DIR=/

              SDL2_VER="2.30.7"
              cd /tmp
              wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
              tar xf "SDL2-${SDL2_VER}.tar.gz"
              cd "SDL2-${SDL2_VER}"
              python3 /tmp/patch_kmsdrm.py .

              CFLAGS="-fPIC -Wno-declaration-after-statement" \
              LDFLAGS="-L/usr/lib/aarch64-linux-gnu" \
              ./configure --prefix=/usr/local \
                --host=aarch64-linux-gnu \
                --enable-video-kmsdrm \
                --disable-video-x11 \
                --disable-video-wayland \
                --disable-video-vulkan \
                --enable-video-opengles \
                --enable-shared --disable-static
              make -j"$(nproc)"
              make install

              cd /workspace/engine

              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              export AR=aarch64-linux-gnu-ar
              export RANLIB=aarch64-linux-gnu-ranlib
              export STRIP=aarch64-linux-gnu-strip
              export PKGCONFIG=pkg-config

              OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
                -funsafe-math-optimizations -fno-math-errno \
                -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe \
                -DNO_X11"

              mkdir -p libs-aarch64-linux-gnu
              cp -r /usr/local/include/SDL2/* libs-aarch64-linux-gnu/
              mkdir -p libs-aarch64-linux-gnu/SDL2
              cp -r /usr/local/include/SDL2/* libs-aarch64-linux-gnu/SDL2/

              echo "=== Dependencies bauen (makelibs) ==="
              time make makelibs FTE_TARGET=linux_arm64

              echo "=== Engine cross-kompilieren (RK3326, KMSDRM, SDL2) ==="
              time make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                NO_X11=1 \
                CC="${CC}" \
                CXX="${CXX}" \
                PKGCONFIG="${PKGCONFIG}" \
                CPUOPTIMIZATIONS="${OPT_FLAGS}" \
                -j"$(nproc)"

              mkdir -p /workspace/engine/release
              cp -a /usr/local/lib/libSDL2-2.0.so* /workspace/engine/release/ || true
              cd /workspace/engine/release
              ln -sf libSDL2-2.0.so.0 libSDL2-2.0.so || true

              echo "=== Patch-Marker in libSDL2-2.0.so.0 ==="
              strings libSDL2-2.0.so.0 | grep "NZP-M9" || echo "WARNUNG: Patch-Marker nicht gefunden!"
            '

      - name: Verify Binary and SDL2
        run: |
          set -euo pipefail
          BIN=$(find engine/release -maxdepth 1 -type f \
            \( -name "nzportablearm64" -o -name "nzportable*" \) 2>/dev/null \
            | grep -v '\.db$' | head -1)

          if [ -z "$BIN" ]; then
            echo "::error::Binary nicht gefunden."
            find engine/release -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi

          file "$BIN"
          if ! file "$BIN" | grep -q "ARM aarch64"; then
            echo "::error::Binary ist NICHT ARM64: $BIN"
            exit 1
          fi
          echo "OK: Binary ist ARM64"

          echo "=== SDL2-Shared-Libs ==="
          ls -la engine/release/libSDL2-2.0.so*

          echo "=== GLIBC-Version ==="
          readelf --version-info "$BIN" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -u || true

      - name: Upload Binary + SDL2
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-rk3326-kmsdrm
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/libSDL2-2.0.so*
          if-no-files-found: error
          retention-days: 14
