name: Build NZP FTE Engine PortMaster (RK3326)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nzp-team/fteqw
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          submodules: recursive

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Native Build in Ubuntu 20.04 ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 -v "${{ github.workspace }}:/workspace" -w /workspace \
            arm64v8/ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update && apt-get install -y --no-install-recommends \
                build-essential make git curl wget ca-certificates pkg-config perl \
                libsdl2-dev libgles2-mesa-dev libegl1-mesa-dev libasound2-dev zlib1g-dev

              git config --global --add safe.directory /workspace
              git config --global --add safe.directory "*"

              cd engine

              # Build required static libraries natively
              make makelibs FTE_TARGET=linux_arm64

              # Build release executable forcing SDL2/GLES and disabling X11/Wayland/Vulkan
              make m-rel \
                FTE_TARGET=linux_arm64 \
                FTE_CONFIG=nzportable \
                USE_SDL=2 \
                NO_X11=1 \
                NO_WAYLAND=1 \
                NO_VULKAN=1 \
                CPUOPTIMIZATIONS="-O2 -march=armv8-a -mtune=cortex-a35 -pipe" \
                -j"$(nproc)"
            '

      - name: Package Executable for PortMaster
        run: |
          set -euo pipefail
          mkdir -p dist/nzp

          # Find the compiled binary
          BIN=$(find engine -maxdepth 4 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" | head -n1)

          if [ -z "${BIN}" ]; then
            echo "Error: No ARM64 binary found after build!"
            exit 1
          fi

          # Rename directly to expected PortMaster filename
          cp "${BIN}" dist/nzp/nzp.aarch64
          chmod +x dist/nzp/nzp.aarch64

          echo "Binary details:"
          file dist/nzp/nzp.aarch64

      - name: Upload PortMaster Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-rk3326-portmaster
          path: dist/nzp/nzp.aarch64
          if-no-files-found: error
