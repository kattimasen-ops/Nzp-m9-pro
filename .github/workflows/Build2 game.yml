name: Build NZP PortMaster Engine (RK3326 / ArkOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nzp-team/fteqw Engine Repository
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Toolchain & arm64 GL Headers
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          
          # arm64-Ports-Quellen hinzufügen (falls Standard-Repos die Pakete nicht bieten)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
          
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            make pkg-config pkg-config-aarch64-linux-gnu \
            libgl-dev:arm64 libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
            libglx-dev:arm64 libgl1-mesa-dev:arm64

      - name: Patch Engine (disable progs.dat CRC check)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          if [ -z "$PR_CMDS" ]; then
            echo "FEHLER: pr_cmds.c nicht gefunden!"
            exit 1
          fi
          echo "Patche $PR_CMDS"
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          echo "=== Gepatchte Funktion ==="
          grep -A3 "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -20

      - name: Compile FTE Engine (Cross-Compile for aarch64)
        run: |
          set -euo pipefail
          if [ -f "engine/Makefile" ]; then
            cd engine
          else
            MAKEFILE_PATH=$(find . -maxdepth 4 \( -iname "makefile" -o -iname "GNUmakefile" \) | head -n 1)
            if [ -z "${MAKEFILE_PATH}" ]; then
              echo "Error: Could not locate Makefile!"
              exit 1
            fi
            cd "$(dirname "${MAKEFILE_PATH}")"
          fi

          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -fno-strict-aliasing -fno-finite-math-only \
            -fomit-frame-pointer -funroll-loops -pipe"

          export CC=aarch64-linux-gnu-gcc
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          make makelibs FTE_TARGET=linux_arm64 -j"$(nproc)" || true

          make m-rel \
            FTE_TARGET=linux_arm64 \
            FTE_CONFIG=nzportable \
            CC=aarch64-linux-gnu-gcc \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            USE_SDL=2 \
            NO_X11=1 \
            NO_WAYLAND=1 \
            NO_VULKAN=1 \
            -j"$(nproc)"

      - name: Stage Complete PortMaster Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/nzp
          BIN=$(find . -maxdepth 6 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" ! -iname "*.py" | head -n 1)
          if [ -z "${BIN}" ]; then
            echo "Error: Engine binary not found after compilation!"
            exit 1
          fi
          cp "${BIN}" dist/nzp/nzp.aarch64
          chmod +x dist/nzp/nzp.aarch64
          echo "Final Artifact Contents:"
          ls -la dist/nzp/
          file dist/nzp/nzp.aarch64

      - name: Upload PortMaster Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-m9pro-portmaster-complete
          path: dist/nzp/
          if-no-files-found: error
