name: Build NZP Engine (ARM64 Cross-Compile, kein QEMU)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-arm64-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fteqw
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Patch CRC check (NZP-M9)
        run: |
          set -euo pipefail
          PR_CMDS=$(find . -path "*/engine/server/pr_cmds.c" | head -n 1)
          [ -n "$PR_CMDS" ] || { echo "FEHLER: pr_cmds.c nicht gefunden"; exit 1; }
          sed -i '/pbool PDECL PR_SSQC_CheckHeaderCrc/{n;s/{/{\n    return true; \/\/ NZP-M9: CRC check disabled/;}' "$PR_CMDS"
          grep -A3 "PR_SSQC_CheckHeaderCrc" "$PR_CMDS" | head -10

      - name: Install ARM64 cross toolchain & ALL X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential make git pkg-config \
            libdrm-dev libgbm-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev zlib1g-dev libpng-dev libjpeg-dev \
            libx11-dev libxext-dev libxss-dev libxcb1-dev \
            libxrandr-dev libxi-dev libxrender-dev libxtst-dev \
            libxt-dev libxfixes-dev libxcursor-dev libxinerama-dev

      - name: Verify X11 headers present
        run: |
          set -euo pipefail
          MISSING=""
          for h in \
            X11/extensions/Xrandr.h \
            X11/extensions/XInput2.h \
            X11/extensions/Xrender.h \
            X11/extensions/XTest.h \
            X11/extensions/Xfixes.h \
            X11/Xcursor/Xcursor.h \
            X11/extensions/Xinerama.h \
            X11/Xlib.h; do
            if [ ! -f "/usr/include/$h" ]; then
              echo "FEHLT: /usr/include/$h"
              MISSING="$MISSING $h"
            else
              echo "OK: /usr/include/$h"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "FEHLER: Fehlende Header:$MISSING"
            exit 1
          fi

      - name: Cache ARM64 deps
        uses: actions/cache@v4
        with:
          path: engine/libs-aarch64-linux-gnu
          key: cross-deps-aarch64-v2
          restore-keys: cross-deps-aarch64-

      - name: Build ARM64 (cross-compile, kein QEMU)
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++
          AR: aarch64-linux-gnu-ar
          RANLIB: aarch64-linux-gnu-ranlib
          STRIP: aarch64-linux-gnu-strip
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/engine/libs-aarch64-linux-gnu
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/engine/libs-aarch64-linux-gnu
        run: |
          set -euo pipefail
          cd engine

          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -funsafe-math-optimizations -fno-math-errno -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe"

          echo "=== Toolchain-Check ==="
          aarch64-linux-gnu-gcc --version | head -1

          echo "=== Dependencies bauen (makelibs) ==="
          time make makelibs FTE_TARGET=linux_arm64

          echo "=== Engine cross-kompilieren ==="
          time make m-rel \
            FTE_TARGET=linux_arm64 \
            FTE_CONFIG=nzportable \
            USE_SDL=2 \
            NO_X11=1 \
            CC="${CC}" \
            CXX="${CXX}" \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            -j"$(nproc)"

      - name: Locate binary and verify architecture
        if: success()
        run: |
          set -euo pipefail

          # FTEQW erzeugt nzportablearm64 (+ .db Debug-Symbole).
          # Ältere Muster bleiben als Fallback drin.
          BIN=$(find engine/release -maxdepth 1 -type f \
            \( -name "nzportablearm64" \
               -o -name "nzportable*" \
               -o -name "nzp.aarch64" \
               -o -name "nzp-sdl" \
               -o -name "fteqw*" \) 2>/dev/null \
            | grep -v '\.db$' | head -1)

          if [ -z "$BIN" ]; then
            echo "FEHLER: Binary nicht gefunden!"
            echo "--- engine/release/ Inhalt (Top-Level) ---"
            find engine/release -maxdepth 1 -type f
            exit 1
          fi

          echo "=== Binary-Info ==="
          file "$BIN"
          ls -la "$BIN"

          if ! file "$BIN" | grep -q "ARM aarch64"; then
            echo "FEHLER: Binary ist NICHT ARM64!"
            exit 1
          fi
          echo "OK: Binary ist ARM64"

          # Debug-Symbole mit auflisten (falls vorhanden)
          DB="${BIN}.db"
          if [ -f "$DB" ]; then
            echo "Debug-Symbole:"
            ls -la "$DB"
          fi

          echo "BINARY_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nzp-aarch64-cross
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/nzp.aarch64
            engine/release/nzp-sdl
            engine/release/fteqw*
          if-no-files-found: error
          retention-days: 30
