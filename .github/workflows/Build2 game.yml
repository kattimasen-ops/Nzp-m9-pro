name: Build NZP PortMaster Engine (RK3326 / ArkOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-portmaster-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nzp-team/fteqw Engine Repository
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            make pkg-config

      - name: Compile FTE Engine (Cross-Compile for aarch64)
        run: |
          set -euo pipefail

          # Locate Makefile inside fteqw source directory
          if [ -f "engine/Makefile" ]; then
            cd engine
          else
            MAKEFILE_PATH=$(find . -maxdepth 4 \( -iname "makefile" -o -iname "GNUmakefile" \) | head -n 1)
            if [ -z "${MAKEFILE_PATH}" ]; then
              echo "Error: Could not locate Makefile!"
              exit 1
            fi
            cd "$(dirname "${MAKEFILE_PATH}")"
          fi

          # ── Optimierte Compiler-Flags für Cortex-A35 (AArch64) ──────
          # -O3: Aggressive Optimierung (beibehalten wie gewünscht)
          # -mcpu=cortex-a35: A35-spezifische Instruktionen (inkl. NEON)
          # -mtune=cortex-a35: Optimiert den Instruction-Scheduler für den A35
          # -fno-strict-aliasing: Quake-Engine-Code verlässt sich auf Typ-Punning
          # -fno-finite-math-only: Konservativer als -funsafe-math-optimizations
          # -fomit-frame-pointer: Gibt das RBP-Register für Berechnungen frei
          # -funroll-loops: Entrollt Schleifen (hilft auf In-Order CPUs wie dem A35)
          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -fno-strict-aliasing -fno-finite-math-only \
            -fomit-frame-pointer -funroll-loops -pipe"

          export CC=aarch64-linux-gnu-gcc

          # makelibs parallelisieren (nutzt alle verfügbaren Kerne)
          make makelibs FTE_TARGET=linux_arm64 -j"$(nproc)" || true

          # Engine kompilieren mit optimierten Flags
          make m-rel \
            FTE_TARGET=linux_arm64 \
            FTE_CONFIG=nzportable \
            CC=aarch64-linux-gnu-gcc \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            USE_SDL=2 \
            NO_X11=1 \
            NO_WAYLAND=1 \
            NO_VULKAN=1 \
            -j"$(nproc)"

      - name: Stage Complete PortMaster Artifact
        run: |
          set -euo pipefail
          mkdir -p dist/nzp

          # Find compiled aarch64 binary
          BIN=$(find . -maxdepth 6 -type f -executable \
                \( -iname "*arm64*" -o -iname "*aarch64*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" ! -iname "*.py" | head -n 1)

          if [ -z "${BIN}" ]; then
            echo "Error: Engine binary not found after compilation!"
            find . -name "*.aarch64" -o -name "fteqw*" -o -name "*arm64*" | head -n 20
            exit 1
          fi

          cp "${BIN}" dist/nzp/nzp.aarch64
          chmod +x dist/nzp/nzp.aarch64

          echo "Final Artifact Contents:"
          ls -la dist/nzp/
          file dist/nzp/nzp.aarch64

      - name: Upload PortMaster Ready Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzp-m9pro-portmaster-complete
          path: dist/nzp/
          if-no-files-found: error
