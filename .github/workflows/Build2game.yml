name: build-rk3326

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/*.yml'

jobs:
  build-rk3326:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout FTEQW
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Write patch scripts to host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"

          cat > "$RUNNER_TEMP/nzp-build/patch_prcmds.py" << 'PYEOF'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); text = p.read_text()
          if "NZP-M9: CRC check disabled" in text:
              print("already patched"); sys.exit(0)
          marker = "pbool PDECL PR_SSQC_CheckHeaderCrc"
          idx = text.find(marker)
          if idx < 0: print("ERROR: marker not found"); sys.exit(1)
          brace = text.find("{", idx)
          if brace < 0: print("ERROR: brace not found"); sys.exit(1)
          text = text[:brace+1] + "\n    return true; /* NZP-M9: CRC check disabled */" + text[brace+1:]
          p.write_text(text); print("pr_cmds.c patched")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_makefile.py" << 'PYEOF'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          text = p.read_text().replace("gl_vidlinuxglx.o", "gl_vidsdl.o")
          lines = text.splitlines()
          MCL_NEW  = "$(D3DGL_OBJS) $(GLQUAKE_OBJS) $(SOFTWARE_OBJS) gl_vidsdl.o gl_videgl.o snd_linux.o snd_sdl.o snd_pulse.o snd_alsa.o cd_sdl.o sys_sdl.o in_sdl.o"
          GLCL_NEW = "$(GL_OBJS) $(D3DGL_OBJS) $(GLQUAKE_OBJS) gl_vidsdl.o gl_videgl.o snd_linux.o snd_sdl.o snd_pulse.o snd_alsa.o cd_sdl.o sys_sdl.o in_sdl.o"
          for i, line in enumerate(lines):
              s = line.lstrip(); indent = line[:len(line)-len(s)]
              if s in ("GLCFLAGS?=-DGLQUAKE", "GLCFLAGS=-DGLQUAKE"):
                  lines[i] = indent + "GLCFLAGS=-DGLQUAKE -DUSE_EGL -DEGLQUAKE"
              elif s.startswith("MCL_OBJS=") and "gl_vidwayland.o" in s:
                  lines[i] = indent + "MCL_OBJS=" + MCL_NEW
              elif s.startswith("GLCL_OBJS=") and "gl_vidwayland.o" in s:
                  lines[i] = indent + "GLCL_OBJS=" + GLCL_NEW
              elif s == "M_CFLAGS=$(VKCFLAGS) $(GL_CFLAGS) $(CLIENTLIBFLAGS)":
                  lines[i] = indent + s + " -DUSE_EGL -DEGLQUAKE -DFTE_SDL"
              elif s.startswith("CL_CFLAGS=-DMULTITHREAD -DDYNAMIC_SDL"):
                  lines[i] = indent + s.replace("$(HAVE_EGL)", "-DUSE_EGL")
          p.write_text("\n".join(lines) + "\n"); print("Makefile patched")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_glvidegl.py" << 'PYEOF'
          import sys, pathlib, re
          p = pathlib.Path(sys.argv[1]); text = p.read_text()
          text = re.sub(r"\n/\* NZP_EGL.*?\n", "\n", text, flags=re.DOTALL)
          if not re.search(r"^(?!\s*extern)[^\n;]*\beglrendererinfo\s*(=|;)", text, re.MULTILINE):
              p.write_text(text + "\n__attribute__((weak)) char *eglrendererinfo = 0;\n")
              print("eglrendererinfo weak stub ADDED")
          else:
              print("eglrendererinfo already defined")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_sdl_kmsdrm.py" << 'PYEOF'
          import sys, pathlib
          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          text = path.read_text()

          if "NZP_GBM_FORMAT_AUTODETECT" in text:
              print("already patched"); sys.exit(0)

          lines = text.split('\n')

          # ---- 1) surface_fmt-Deklaration finden ----
          sf_idx = None
          for i, line in enumerate(lines):
              if 'uint32_t surface_fmt = GBM_FORMAT_ARGB8888;' in line:
                  sf_idx = i
                  break
          if sf_idx is None:
              print("ERROR: surface_fmt declaration not found"); sys.exit(1)
          indent = lines[sf_idx][:len(lines[sf_idx]) - len(lines[sf_idx].lstrip())]
          print("OK: surface_fmt line found at index %d" % sf_idx)

          # surface_fmt -> Deklaration ohne Init
          lines[sf_idx] = indent + "uint32_t surface_fmt;"

          # ---- 2) surface_flags finden (muss kurz danach kommen) ----
          flags_idx = None
          for i in range(sf_idx, min(sf_idx + 10, len(lines))):
              if 'uint32_t surface_flags' in lines[i]:
                  flags_idx = i
                  break
          if flags_idx is None:
              print("ERROR: surface_flags line not found"); sys.exit(1)
          print("OK: surface_flags line found at index %d" % flags_idx)

          # ---- 3) Späte Deklarationen sammeln und entfernen ----
          late_decls = []
          late_idxs = []
          for i in range(flags_idx + 1, len(lines)):
              stripped = lines[i].strip()
              if not stripped:
                  continue
              # EGLContext egl_context;
              if "EGLContext egl_context" in stripped and stripped.endswith(";"):
                  late_decls.append(lines[i])
                  late_idxs.append(i)
                  print("OK: found late decl 'EGLContext egl_context' at index %d" % i)
              # bool result = false;  /  bool result;
              elif "bool result" in stripped and stripped.endswith(";"):
                  late_decls.append(lines[i])
                  late_idxs.append(i)
                  print("OK: found late decl 'bool result' at index %d" % i)

          # Entferne die späten Deklarationen (von hinten nach vorne, um Indizes nicht zu verschieben)
          for i in sorted(late_idxs, reverse=True):
              del lines[i]

          # ---- 4) flags_idx nach dem Löschen neu berechnen ----
          flags_idx = None
          for i, line in enumerate(lines):
              if 'uint32_t surface_flags' in line:
                  flags_idx = i
                  break
          if flags_idx is None:
              print("ERROR: surface_flags not found after removing late decls"); sys.exit(1)

          # ---- 5) Einfügeblock zusammenbauen: late_decls + Auto-Detect ----
          insert_lines = []
          for decl in late_decls:
              insert_lines.append(decl)
          if late_decls:
              insert_lines.append("")

          insert_lines.append(indent + "/* NZP_GBM_FORMAT_AUTODETECT */")
          insert_lines.append(indent + "{")
          insert_lines.append(indent + "    static const uint32_t nzp_gbm_formats[] = {")
          insert_lines.append(indent + "        GBM_FORMAT_XRGB8888, GBM_FORMAT_ARGB8888,")
          insert_lines.append(indent + "        GBM_FORMAT_RGB565,   GBM_FORMAT_BGR565,")
          insert_lines.append(indent + "        GBM_FORMAT_XBGR8888, GBM_FORMAT_ABGR8888,")
          insert_lines.append(indent + "        GBM_FORMAT_RGBX8888, GBM_FORMAT_RGBA8888,")
          insert_lines.append(indent + "        GBM_FORMAT_BGRX8888, GBM_FORMAT_BGRA8888")
          insert_lines.append(indent + "    };")
          insert_lines.append(indent + "    int nzp_i;")
          insert_lines.append(indent + "    surface_fmt = GBM_FORMAT_ARGB8888; /* fallback */")
          insert_lines.append(indent + "    for (nzp_i = 0; nzp_i < (int)(sizeof(nzp_gbm_formats)/sizeof(nzp_gbm_formats[0])); nzp_i++) {")
          insert_lines.append(indent + "        if (KMSDRM_gbm_device_is_format_supported(viddata->gbm_dev,")
          insert_lines.append(indent + "                                                  nzp_gbm_formats[nzp_i], surface_flags)) {")
          insert_lines.append(indent + "            surface_fmt = nzp_gbm_formats[nzp_i];")
          insert_lines.append(indent + "            SDL_Log(\"NZP: using GBM format 0x%08x\", surface_fmt);")
          insert_lines.append(indent + "            break;")
          insert_lines.append(indent + "        }")
          insert_lines.append(indent + "    }")
          insert_lines.append(indent + "}")

          # ---- 6) Nach surface_flags einfügen ----
          lines = lines[:flags_idx + 1] + insert_lines + lines[flags_idx + 1:]

          text = '\n'.join(lines)

          # ---- 7) Alten "Trying anyway"-Warnblock entfernen ----
          import re
          warn_pattern = re.compile(
              r"[ \t]*if\s*\(!KMSDRM_gbm_device_is_format_supported\s*\([^)]*\)\s*\)\s*\{\s*\n"
              r"[ \t]*SDL_LogWarn\s*\(\s*SDL_LOG_CATEGORY_VIDEO\s*,\s*\n?"
              r"[ \t]*\"GBM surface format not supported\. Trying anyway\.\"\s*\)\s*;\s*\n"
              r"[ \t]*\}\s*\n",
          )
          new_text = warn_pattern.sub("", text, count=1)
          if new_text != text:
              text = new_text
              print("OK: removed old 'Trying anyway' warning")

          # ---- 8) KMSDRM_CreateWindow: echten Fehler loggen ----
          caller_pattern = re.compile(
              r"if\s*\(\s*!KMSDRM_CreateSurfaces\s*\(\s*_this\s*,\s*window\s*\)\s*\)\s*\{\s*\n"
              r"([ \t]*)return\s+SDL_SetError\s*\(\s*\"Can't window GBM/EGL surfaces on window creation\.\"\s*\)\s*;\s*\n"
              r"[ \t]*\}",
          )
          def caller_repl(m):
              ind = m.group(1)
              return ("if (!KMSDRM_CreateSurfaces(_this, window)) {\n"
                      + ind + "SDL_LogError(SDL_LOG_CATEGORY_VIDEO, \"NZP: KMSDRM_CreateSurfaces failed: %s\", SDL_GetError());\n"
                      + ind + "return SDL_SetError(\"Can't window GBM/EGL surfaces on window creation.\");\n"
                      + "    }")
          new_text, n = caller_pattern.subn(caller_repl, text, count=1)
          if n > 0:
              text = new_text
              print("OK: KMSDRM_CreateWindow logs real error")

          path.write_text(text)

          # ---- 9) Verifikation: Bereich um surface_fmt herum ausgeben ----
          print("=== Verify: 30 Zeilen ab surface_fmt ===")
          verify_lines = text.split('\n')
          start = None
          for i, line in enumerate(verify_lines):
              if 'uint32_t surface_fmt;' in line:
                  start = i
                  break
          if start is not None:
              for line in verify_lines[max(0, start-3):start + 30]:
                  print("   ", line)
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_sdl_misc.py" << 'PYEOF'
          import sys, pathlib, re
          path = pathlib.Path(sys.argv[1] + "/src/video/kmsdrm/SDL_kmsdrmvideo.c")
          t = path.read_text()
          if "NZP-M9-KMSDRM-WINDOW-FLAG" not in t:
              m = re.search(r"(window->driverdata\s*=\s*windata\s*;)", t, re.DOTALL)
              if m:
                  ins = ("    /* NZP-M9-KMSDRM-WINDOW-FLAG */\n"
                         "    if (!(window->flags & SDL_WINDOW_VULKAN)) {\n"
                         "        window->flags |= SDL_WINDOW_OPENGL;\n"
                         "    }\n\n")
                  t = t[:m.start()] + ins + t[m.start():]
                  path.write_text(t); print("OK: Window-Flag Patch")
          t = path.read_text()
          if "NZP-M9-PAGEFLIP-FALLBACK" not in t:
              m = re.search(r"(KMSDRM_drmModePageFlip\s*\([^;]+;)", t, re.DOTALL)
              if m:
                  fb = ("\n    /* NZP-M9-PAGEFLIP-FALLBACK */\n"
                        "    if (ret != 0 && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {\n"
                        "        viddata->async_pageflip_support = SDL_FALSE;\n"
                        "        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;\n"
                        "        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);\n"
                        "    }\n")
                  t = t[:m.end()] + fb + t[m.end():]
                  path.write_text(t); print("OK: Pageflip-Fallback")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/build.sh" << 'BUILDEOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          dpkg --add-architecture arm64
          sed -i "s|^deb |deb [arch=amd64] |" /etc/apt/sources.list
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse"
          } > /etc/apt/sources.list.d/arm64-ports.list

          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential make git pkg-config wget ca-certificates python3

          git config --global --add safe.directory /workspace

          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
            libasound2-dev:arm64 zlib1g-dev:arm64 libpng-dev:arm64 libjpeg-dev:arm64 \
            libxss-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 libxext-dev:arm64

          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/

          SDL2_VER="2.30.11"
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
          tar xf "SDL2-${SDL2_VER}.tar.gz"
          cd "SDL2-${SDL2_VER}"

          echo "=== SDL KMSDRM Patch ==="
          python3 /tmp/patch_sdl_kmsdrm.py .

          echo "=== SDL misc patches ==="
          python3 /tmp/patch_sdl_misc.py .

          echo "=== Verify patched source (grep) ==="
          grep -n "NZP_GBM_FORMAT_AUTODETECT\|NZP: KMSDRM_CreateSurfaces failed\|EGLContext egl_context" src/video/kmsdrm/SDL_kmsdrmvideo.c | head -8 || true

          CFLAGS="-fPIC -Wno-declaration-after-statement" \
          LDFLAGS="-L/usr/lib/aarch64-linux-gnu" \
          ./configure --prefix=/usr/local --host=aarch64-linux-gnu \
            --enable-video-kmsdrm --disable-video-x11 --disable-video-wayland \
            --disable-video-vulkan --enable-video-opengles --enable-shared --disable-static
          make -j"$(nproc)"
          make install

          if [ ! -d /usr/local/include/SDL2 ] || [ -z "$(ls -A /usr/local/include/SDL2 2>/dev/null)" ]; then
            echo "FATAL: /usr/local/include/SDL2 fehlt oder leer"; exit 1
          fi

          for f in /usr/local/lib/libSDL2-2.0.so.0 /usr/local/lib/libSDL2-2.0.so; do
            [ -e "$f" ] && ln -sf "$f" /usr/local/lib/libSDL2.so && break
          done

          echo "=== Verify binary markers ==="
          strings /usr/local/lib/libSDL2-2.0.so.0 | grep -E "NZP: using GBM format|NZP: KMSDRM_CreateSurfaces failed" | head -3 || \
            { echo "FATAL: Marker nicht im Binary"; exit 1; }

          echo "=== SDL2 md5 ==="
          md5sum /usr/local/lib/libSDL2-2.0.so.0.3000.11

          cd /workspace/engine

          echo "=== zlib-1.3.1 von GitHub laden ==="
          rm -f zlib-1.3.1.tar.gz
          wget -q -O zlib-1.3.1.tar.gz \
            "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          gzip -t zlib-1.3.1.tar.gz || { echo "FATAL: zlib kein gzip"; exit 1; }

          echo "=== Patch pr_cmds.c ==="
          python3 /tmp/patch_prcmds.py /workspace/engine/server/pr_cmds.c

          echo "=== Patch Makefile ==="
          python3 /tmp/patch_makefile.py /workspace/engine/Makefile
          grep -n "^GLCFLAGS" /workspace/engine/Makefile | head -3 || true
          grep -n "^[[:space:]]*MCL_OBJS=.*snd_pulse" /workspace/engine/Makefile || true

          echo "=== Patch gl_videgl.c ==="
          python3 /tmp/patch_glvidegl.py /workspace/engine/gl/gl_videgl.c
          tail -3 /workspace/engine/gl/gl_videgl.c || true

          export CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib STRIP=aarch64-linux-gnu-strip
          export PKGCONFIG=/usr/bin/aarch64-linux-gnu-pkg-config
          export SDLCONFIG=/usr/local/bin/sdl2-config
          export SDLLIBS="-L/usr/local/lib -lSDL2"
          export SDLCFLAGS="-I/usr/local/include/SDL2 -D_REENTRANT -DUSE_SDL=2 -DEGLQUAKE -DUSE_EGL -DFTE_SDL"

          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -funsafe-math-optimizations -fno-math-errno \
            -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe \
            -DNO_X11 -DUSE_SDL=2 -DEGLQUAKE -DUSE_EGL -DFTE_SDL"

          mkdir -p libs-aarch64-linux-gnu/SDL2
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/SDL2/

          echo "=== makelibs ==="
          time make makelibs FTE_TARGET=linux_arm64

          rm -rf /workspace/engine/release/m_linuxarm64

          echo "=== Engine cross-kompilieren ==="
          set +e
          time make m-rel FTE_TARGET=linux_arm64 FTE_CONFIG=nzportable USE_SDL=2 SDL=2 NO_X11=1 \
            CC="${CC}" CXX="${CXX}" PKGCONFIG="${PKGCONFIG}" \
            SDLCONFIG="${SDLCONFIG}" SDLLIBS="${SDLLIBS}" SDLCFLAGS="${SDLCFLAGS}" \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            LDFLAGS="-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib -lSDL2" -j"$(nproc)"
          BUILD_RC=$?
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "=== LINK FEHLGESCHLAGEN (RC=$BUILD_RC) ==="
            exit 1
          fi

          mkdir -p /workspace/engine/release
          cp -a /usr/local/lib/libSDL2-2.0.so* /workspace/engine/release/ || true
          cp -a /usr/local/lib/libSDL2.so  /workspace/engine/release/ || true
          cd /workspace/engine/release
          ln -sf libSDL2-2.0.so.0 libSDL2-2.0.so || true

          echo "=== FINAL ==="
          ls -la libSDL2-2.0.so* nzportablearm64*
          md5sum libSDL2-2.0.so.0.3000.11 nzportablearm64
          BUILDEOF

      - name: Cross-Compile in ubuntu:20.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_prcmds.py:/tmp/patch_prcmds.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_makefile.py:/tmp/patch_makefile.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_glvidegl.py:/tmp/patch_glvidegl.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_sdl_kmsdrm.py:/tmp/patch_sdl_kmsdrm.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_sdl_misc.py:/tmp/patch_sdl_misc.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/build.sh:/tmp/build.sh:ro" \
            -w /workspace \
            ubuntu:20.04 bash /tmp/build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-rk3326-kmsdrm
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/libSDL2-2.0.so.0
            engine/release/libSDL2-2.0.so
          if-no-files-found: error
