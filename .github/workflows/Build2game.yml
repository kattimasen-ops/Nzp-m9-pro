name: build-rk3326

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/*.yml'

jobs:
  build-rk3326:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout FTEQW
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Write patch scripts and cross-file to host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nzp-build"

          cat > "$RUNNER_TEMP/nzp-build/aarch64-cross.ini" << 'CROSSEOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          CROSSEOF
          sed -i 's/^          //' "$RUNNER_TEMP/nzp-build/aarch64-cross.ini"

          cat > "$RUNNER_TEMP/nzp-build/patch_prcmds.py" << 'PYEOF'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]); text = p.read_text()
          if "NZP-M9: CRC check disabled" in text:
              print("already patched"); sys.exit(0)
          marker = "pbool PDECL PR_SSQC_CheckHeaderCrc"
          idx = text.find(marker)
          if idx < 0: print("ERROR: marker not found"); sys.exit(1)
          brace = text.find("{", idx)
          if brace < 0: print("ERROR: brace not found"); sys.exit(1)
          text = text[:brace+1] + "\n    return true; /* NZP-M9: CRC check disabled */" + text[brace+1:]
          p.write_text(text); print("pr_cmds.c patched")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_makefile.py" << 'PYEOF'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1])
          text = p.read_text().replace("gl_vidlinuxglx.o", "gl_vidsdl.o")
          lines = text.splitlines()
          MCL_NEW  = "$(D3DGL_OBJS) $(GLQUAKE_OBJS) $(SOFTWARE_OBJS) gl_vidsdl.o gl_videgl.o snd_linux.o snd_sdl.o snd_pulse.o snd_alsa.o cd_sdl.o sys_sdl.o in_sdl.o"
          GLCL_NEW = "$(GL_OBJS) $(D3DGL_OBJS) $(GLQUAKE_OBJS) gl_vidsdl.o gl_videgl.o snd_linux.o snd_sdl.o snd_pulse.o snd_alsa.o cd_sdl.o sys_sdl.o in_sdl.o"
          for i, line in enumerate(lines):
              s = line.lstrip(); indent = line[:len(line)-len(s)]
              if s in ("GLCFLAGS?=-DGLQUAKE", "GLCFLAGS=-DGLQUAKE"):
                  lines[i] = indent + "GLCFLAGS=-DGLQUAKE -DUSE_EGL -DEGLQUAKE"
              elif s.startswith("MCL_OBJS=") and "gl_vidwayland.o" in s:
                  lines[i] = indent + "MCL_OBJS=" + MCL_NEW
              elif s.startswith("GLCL_OBJS=") and "gl_vidwayland.o" in s:
                  lines[i] = indent + "GLCL_OBJS=" + GLCL_NEW
              elif s == "M_CFLAGS=$(VKCFLAGS) $(GL_CFLAGS) $(CLIENTLIBFLAGS)":
                  lines[i] = indent + s + " -DUSE_EGL -DEGLQUAKE -DFTE_SDL"
              elif s.startswith("CL_CFLAGS=-DMULTITHREAD -DDYNAMIC_SDL"):
                  lines[i] = indent + s.replace("$(HAVE_EGL)", "-DUSE_EGL")
          p.write_text("\n".join(lines) + "\n"); print("Makefile patched")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_glvidegl.py" << 'PYEOF'
          import sys, pathlib, re
          p = pathlib.Path(sys.argv[1]); text = p.read_text()
          text = re.sub(r"\n/\* NZP_EGL.*?\n", "\n", text, flags=re.DOTALL)
          if not re.search(r"^(?!\s*extern)[^\n;]*\beglrendererinfo\s*(=|;)", text, re.MULTILINE):
              p.write_text(text + "\n__attribute__((weak)) char *eglrendererinfo = 0;\n")
              print("eglrendererinfo weak stub ADDED")
          else:
              print("eglrendererinfo already defined")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_sdl_kmsdrm.py" << 'PYEOF'
          import sys, pathlib, re
          root = pathlib.Path(sys.argv[1])

          vid = root / "src/video/kmsdrm/SDL_kmsdrmvideo.c"
          text = vid.read_text()
          lines = text.splitlines()
          fixed = False
          for i, line in enumerate(lines):
              if 'ret = KMSDRM_CreateSurfaces(_this, window);' in line:
                  for j in range(i+1, min(i+6, len(lines))):
                      if 'if (ret == 0)' in lines[j]:
                          lines[j] = lines[j].replace('if (ret == 0)', 'if (ret != 0)')
                          fixed = True
                          print("OK: KMSDRM_CreateWindow invertierte Pruefung (Zeile %d) korrigiert" % (j+1))
                          break
                  if fixed: break
          if not fixed:
              print("WARN: invertierte Pruefung nicht gefunden (evtl. bereits korrekt)")
          text = '\n'.join(lines)

          if "NZP: format autodetect" in text:
              print("already format-autodetect")
          else:
              decl_re = re.compile(
                  r"(\s*)uint32_t\s+surface_fmt\s*=\s*GBM_FORMAT_ARGB8888\s*;\s*\n"
                  r"\s*uint32_t\s+surface_flags\s*=\s*GBM_BO_USE_SCANOUT\s*\|\s*GBM_BO_USE_RENDERING\s*;\s*\n"
                  r"\s*uint32_t\s+width,\s*height\s*;\s*\n"
                  r"\s*EGLContext\s+egl_context\s*;\s*\n"
                  r"\s*int\s+ret\s*=\s*0\s*;"
              )
              m = decl_re.search(text)
              if m:
                  indent = m.group(1)
                  replacement = (
                      indent + "uint32_t surface_fmt = 0; /* NZP: format autodetect */\n"
                      + indent + "uint32_t surface_flags = GBM_BO_USE_SCANOUT | GBM_BO_USE_RENDERING;\n"
                      + indent + "uint32_t width, height;\n"
                      + indent + "EGLContext egl_context;\n"
                      + indent + "int ret = 0;\n"
                      + "\n"
                      + indent + "/* NZP: format autodetect */\n"
                      + indent + "{\n"
                      + indent + "    static const uint32_t nzp_gbm_formats[] = {\n"
                      + indent + "        GBM_FORMAT_XRGB8888, GBM_FORMAT_ARGB8888,\n"
                      + indent + "        GBM_FORMAT_RGB565,   GBM_FORMAT_BGR565,\n"
                      + indent + "        GBM_FORMAT_XBGR8888, GBM_FORMAT_ABGR8888,\n"
                      + indent + "        GBM_FORMAT_RGBX8888, GBM_FORMAT_RGBA8888,\n"
                      + indent + "        GBM_FORMAT_BGRX8888, GBM_FORMAT_BGRA8888\n"
                      + indent + "    };\n"
                      + indent + "    int nzp_i;\n"
                      + indent + "    for (nzp_i = 0; nzp_i < (int)(sizeof(nzp_gbm_formats)/sizeof(nzp_gbm_formats[0])); nzp_i++) {\n"
                      + indent + "        if (KMSDRM_gbm_device_is_format_supported(viddata->gbm_dev,\n"
                      + indent + "                                                  nzp_gbm_formats[nzp_i], surface_flags)) {\n"
                      + indent + "            surface_fmt = nzp_gbm_formats[nzp_i];\n"
                      + indent + "            SDL_Log(\"NZP: using GBM format 0x%08x\", surface_fmt);\n"
                      + indent + "            break;\n"
                      + indent + "        }\n"
                      + indent + "    }\n"
                      + indent + "    if (surface_fmt == 0) {\n"
                      + indent + "        surface_fmt = GBM_FORMAT_XRGB8888;\n"
                      + indent + "        SDL_LogWarn(SDL_LOG_CATEGORY_VIDEO, \"NZP: no format supported, fallback XRGB8888\");\n"
                      + indent + "    }\n"
                      + indent + "}\n"
                  )
                  text = text[:m.start()] + replacement + text[m.end():]
                  print("OK: Format-Autodetect eingefuegt (SDL 2.30.10 Layout)")
              else:
                  print("WARN: Format-Deklarationsblock nicht gefunden (evtl. bereits gepatcht)")

          if "NZP_ASYNC_DISABLED" not in text:
              replaced = 0
              for pat in [r"viddata->async_pageflip_support\s*=\s*support\s*;",
                          r"viddata->async_pageflip_support\s*=\s*SDL_TRUE\s*;",
                          r"viddata->async_pageflip_support\s*=\s*true\s*;"]:
                  new_text, n = re.subn(pat, "viddata->async_pageflip_support = SDL_FALSE; /* NZP_ASYNC_DISABLED */", text)
                  if n > 0:
                      text = new_text
                      replaced += n
              if replaced > 0:
                  print("OK: async_pageflip_support force-disabled (%d Stellen)" % replaced)
              else:
                  print("WARN: async_pageflip_support assignment not found")
          else:
              print("already async-disabled")

          vid.write_text(text)

          gles = root / "src/video/kmsdrm/SDL_kmsdrmopengles.c"
          gtext = gles.read_text()
          if "NZP_ASYNC_SWAP_FALLBACK" not in gtext:
              old_line = "    ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);"
              if old_line in gtext:
                  fallback_lines = [
                      "    ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);",
                      "    /* NZP_ASYNC_SWAP_FALLBACK */",
                      "    if (ret && (flip_flags & DRM_MODE_PAGE_FLIP_ASYNC)) {",
                      "        viddata->async_pageflip_support = SDL_FALSE;",
                      "        flip_flags &= ~DRM_MODE_PAGE_FLIP_ASYNC;",
                      "        ret = KMSDRM_drmModePageFlip(viddata->drm_fd, dispdata->crtc->crtc_id, fb_info->fb_id, flip_flags, &windata->waiting_for_flip);",
                      "        if (ret == 0) { SDL_LogInfo(SDL_LOG_CATEGORY_VIDEO, \"NZP: async flip rejected, using sync\"); }",
                      "    }",
                  ]
                  gtext = gtext.replace(old_line, "\n".join(fallback_lines), 1)
                  gles.write_text(gtext)
                  print("OK: SwapWindow async-fallback eingefuegt")
              else:
                  print("WARN: SwapWindow page-flip line not found (force-disable greift trotzdem)")
          else:
              print("already async-swap-fallback")
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/patch_getsym_fallback.py" << 'PYEOF'
          import pathlib, re
          vid = pathlib.Path("src/video/kmsdrm/SDL_kmsdrmvideo.c")
          text = vid.read_text()
          if "KMSDRM_GetSym(const char *fnname, int *pHasModule, bool required)" in text:
              print("GetSym already has required param"); raise SystemExit(0)
          old_sig = "static void *KMSDRM_GetSym(const char *fnname, int *pHasModule)"
          new_sig = "static void *KMSDRM_GetSym(const char *fnname, int *pHasModule, bool required)"
          if old_sig in text:
              text = text.replace(old_sig, new_sig, 1)
              print("OK: KMSDRM_GetSym -> required param")
          else:
              print("WARN: KMSDRM_GetSym signature not found")
          old_kill = "if (!fn) {\n        *pHasModule = 0; // kill this module."
          new_kill = "if (!fn && required) {\n        *pHasModule = 0; // kill this module."
          if old_kill in text:
              text = text.replace(old_kill, new_kill, 1)
              print("OK: missing symbols no longer kill module unless required")
          else:
              print("WARN: kill-module block not found")
          sym_h = pathlib.Path("src/video/kmsdrm/SDL_kmsdrmsym.h")
          if sym_h.exists():
              st = sym_h.read_text()
              optional = ["drmModeAddFB2WithModifiers", "gbm_bo_get_modifier", "gbm_bo_get_plane_count", "gbm_bo_get_offset", "gbm_bo_get_stride_for_plane"]
              for fn in optional:
                  st = re.sub(r"(SDL_KMSDRM_SYM\([^,]+,\s*" + re.escape(fn) + r")", r"SDL_KMSDRM_SYM_OPT\1", st)
              sym_h.write_text(st)
              print("OK: optional symbols marked in SDL_kmsdrmsym.h")
          vid.write_text(text)
          PYEOF

          cat > "$RUNNER_TEMP/nzp-build/build.sh" << 'BUILDEOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          dpkg --add-architecture arm64
          sed -i "s|^deb |deb [arch=amd64] |" /etc/apt/sources.list
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse"
          } > /etc/apt/sources.list.d/arm64-ports.list

          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential make git pkg-config wget ca-certificates python3 patch file patchelf meson ninja-build

          git config --global --add safe.directory /workspace

          apt-get install -y --no-install-recommends \
            libdrm-dev:arm64 libgbm-dev:arm64 libgles2-mesa-dev:arm64 libegl1-mesa-dev:arm64 \
            libasound2-dev:arm64 zlib1g-dev:arm64 libpng-dev:arm64 libjpeg-dev:arm64 \
            libxss-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 libxext-dev:arm64

          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/local/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/

          SDL2_VER="2.30.10"
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VER}/SDL2-${SDL2_VER}.tar.gz"
          tar xf "SDL2-${SDL2_VER}.tar.gz"
          cd "SDL2-${SDL2_VER}"

          echo "=== Apply official d501f6d (KMSDRM_GetSym optional) ==="
          PATCH_URL="https://github.com/libsdl-org/SDL/commit/d501f6db07d4a067f7261d1ef51bec199f6d421f.patch"
          if wget -q -O /tmp/d501f6d.patch "$PATCH_URL" && \
             patch -p1 --forward --no-backup-if-mismatch -i /tmp/d501f6d.patch; then
            echo "OK: d501f6d applied via patch -p1"
          else
            echo "WARN: d501f6d failed, applying manual GetSym fallback"
            python3 /tmp/patch_getsym_fallback.py
          fi

          echo "=== SDL KMSDRM + Async-Pageflip-Patches ==="
          python3 /tmp/patch_sdl_kmsdrm.py .

          CFLAGS="-fPIC -Wno-declaration-after-statement -Wno-error=declaration-after-statement" \
          LDFLAGS="-L/usr/lib/aarch64-linux-gnu" \
          ./configure --prefix=/usr/local --host=aarch64-linux-gnu \
            --enable-video-kmsdrm --disable-video-x11 --disable-video-wayland \
            --disable-video-vulkan --enable-video-opengles --enable-shared --disable-static

          make -j"$(nproc)"
          make install

          if [ ! -d /usr/local/include/SDL2 ] || [ -z "$(ls -A /usr/local/include/SDL2 2>/dev/null)" ]; then
            echo "FATAL: /usr/local/include/SDL2 fehlt oder leer"; exit 1
          fi

          for f in /usr/local/lib/libSDL2-2.0.so.0 /usr/local/lib/libSDL2-2.0.so; do
            [ -e "$f" ] && ln -sf "$f" /usr/local/lib/libSDL2.so && break
          done

          aarch64-linux-gnu-nm -D /usr/local/lib/libSDL2-2.0.so.0 | grep -q "KMSDRM_CreateSurfaces" && \
            echo "OK: KMSDRM_CreateSurfaces exported"
          md5sum /usr/local/lib/libSDL2-2.0.so.0.3000.10 || true

          cd /workspace/engine

          echo "=== zlib-1.3.1 von GitHub laden ==="
          rm -f zlib-1.3.1.tar.gz
          wget -q -O zlib-1.3.1.tar.gz "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
          gzip -t zlib-1.3.1.tar.gz || { echo "FATAL: zlib kein gzip"; exit 1; }

          echo "=== Patch pr_cmds.c ==="
          python3 /tmp/patch_prcmds.py /workspace/engine/server/pr_cmds.c

          echo "=== Patch Makefile ==="
          python3 /tmp/patch_makefile.py /workspace/engine/Makefile

          echo "=== Patch gl_videgl.c ==="
          python3 /tmp/patch_glvidegl.py /workspace/engine/gl/gl_videgl.c

          export CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ AR=aarch64-linux-gnu-ar RANLIB=aarch64-linux-gnu-ranlib STRIP=aarch64-linux-gnu-strip
          export PKGCONFIG=/usr/bin/aarch64-linux-gnu-pkg-config
          export SDLCONFIG=/usr/local/bin/sdl2-config
          export SDLLIBS="-L/usr/local/lib -lSDL2"
          export SDLCFLAGS="-I/usr/local/include/SDL2 -D_REENTRANT -DUSE_SDL=2 -DEGLQUAKE -DUSE_EGL -DFTE_SDL"

          OPT_FLAGS="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 \
            -funsafe-math-optimizations -fno-math-errno \
            -fno-trapping-math -fomit-frame-pointer -funroll-loops -pipe \
            -DNO_X11 -DUSE_SDL=2 -DEGLQUAKE -DUSE_EGL -DFTE_SDL"

          mkdir -p libs-aarch64-linux-gnu/SDL2
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/
          cp -r /usr/local/include/SDL2/. libs-aarch64-linux-gnu/SDL2/

          echo "=== makelibs ==="
          time make makelibs FTE_TARGET=linux_arm64

          rm -rf /workspace/engine/release/m_linuxarm64

          echo "=== Engine cross-kompilieren ==="
          set +e
          time make m-rel FTE_TARGET=linux_arm64 FTE_CONFIG=nzportable USE_SDL=2 SDL=2 NO_X11=1 \
            CC="${CC}" CXX="${CXX}" PKGCONFIG="${PKGCONFIG}" \
            SDLCONFIG="${SDLCONFIG}" SDLLIBS="${SDLLIBS}" SDLCFLAGS="${SDLCFLAGS}" \
            CPUOPTIMIZATIONS="${OPT_FLAGS}" \
            LDFLAGS="-L/usr/local/lib -Wl,-rpath-link,/usr/local/lib -lSDL2" -j"$(nproc)"
          BUILD_RC=$?
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "=== LINK FEHLGESCHLAGEN (RC=$BUILD_RC) ==="
            exit 1
          fi

          mkdir -p /workspace/engine/release
          cp -a /usr/local/lib/libSDL2-2.0.so* /workspace/engine/release/ || true
          cp -a /usr/local/lib/libSDL2.so  /workspace/engine/release/ || true
          cd /workspace/engine/release
          ln -sf libSDL2-2.0.so.0 libSDL2-2.0.so || true

          echo "=== FINAL ==="
          ls -la libSDL2-2.0.so* nzportablearm64*
          md5sum libSDL2-2.0.so.0.3000.10 nzportablearm64 || true
          BUILDEOF

      - name: Cross-Compile Engine & SDL2 in ubuntu:20.04
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/patch_prcmds.py:/tmp/patch_prcmds.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_makefile.py:/tmp/patch_makefile.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_glvidegl.py:/tmp/patch_glvidegl.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_sdl_kmsdrm.py:/tmp/patch_sdl_kmsdrm.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/patch_getsym_fallback.py:/tmp/patch_getsym_fallback.py:ro" \
            -v "$RUNNER_TEMP/nzp-build/build.sh:/tmp/build.sh:ro" \
            -w /workspace \
            ubuntu:20.04 bash /tmp/build.sh

      - name: Build Mali Hook (GLIBC 2.31)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/nzp-build/aarch64-cross.ini:/tmp/aarch64-cross.ini:ro" \
            -w /workspace \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update -qq
              apt-get install -y -qq \
                gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                build-essential git pkg-config wget ca-certificates python3 patch file patchelf meson ninja-build \
                libdrm-dev:arm64 libgbm-dev:arm64

              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_SYSROOT_DIR=/

              RELEASE_DIR="/workspace/engine/release"
              MALI_HOOK_DIR="$RELEASE_DIR/mali-hook"
              mkdir -p "$MALI_HOOK_DIR"

              echo "=== Klone libmali-rockchip (tsukumijima) ==="
              rm -rf /tmp/libmali-rockchip
              git clone --depth 1 https://github.com/tsukumijima/libmali-rockchip.git /tmp/libmali-rockchip
              cd /tmp/libmali-rockchip

              echo "=== Erstelle Symlink für grabber.sh (arm64 -> aarch64) ==="
              ln -sf lib/arm64 lib/aarch64

              echo "=== Cross-File-Inhalt ==="
              cat /tmp/aarch64-cross.ini

              echo "=== Konfiguriere Meson für Bifrost G31 (GBM, g24p0) ==="
              meson setup builddir \
                --cross-file /tmp/aarch64-cross.ini \
                --prefix=/usr/local \
                --libdir=lib/aarch64-linux-gnu \
                -Dgpu=bifrost-g31 \
                -Dversion=g24p0 \
                -Dsubversion=none \
                -Dplatform=gbm \
                -Darch=arm64 \
                -Dopencl-icd=false \
                -Dvendor-package=false \
                -Dwrappers=enabled \
                -Dhooks=true

              echo "=== Baue Hook und Wrapper ==="
              ninja -C builddir

              echo "=== Kopiere die kompilierten Bibliotheken ==="
              find builddir -name "libmali-hook.so*" -o -name "libEGL.so*" -o -name "libGLESv2.so*" -o -name "libgbm.so*" | while read -r f; do
                cp -L "$f" "$MALI_HOOK_DIR/$(basename "$f")"
                echo "  -> $(basename "$f")"
              done

              echo "=== Kopiere den vorkompilierten Mali-Treiber (g24p0) ==="
              DRIVER=$(find /tmp/libmali-rockchip/lib -name "libmali-bifrost-g31-g24p0-gbm.so" | head -1)
              if [ -z "$DRIVER" ]; then
                echo "FEHLER: Mali-Treiber libmali-bifrost-g31-g24p0-gbm.so nicht gefunden"
                exit 1
              fi
              cp -L "$DRIVER" "$MALI_HOOK_DIR/libmali-bifrost-g31-g24p0-gbm.so"
              cd "$MALI_HOOK_DIR"
              ln -sf "libmali-bifrost-g31-g24p0-gbm.so" libmali.so
              ln -sf "libmali-bifrost-g31-g24p0-gbm.so" libmali.so.1

              echo "=== Setze SONAMEs mit patchelf ==="
              if command -v patchelf >/dev/null 2>&1; then
                patchelf --set-soname libmali.so.1 "$MALI_HOOK_DIR/libmali-bifrost-g31-g24p0-gbm.so" 2>/dev/null || true
                patchelf --set-soname libmali-hook.so.1 "$MALI_HOOK_DIR/libmali-hook.so.1" 2>/dev/null || true
                echo "OK: SONAMEs gesetzt"
              fi

              echo "=== Inhalt von mali-hook/ ==="
              ls -la "$MALI_HOOK_DIR"

              echo "=== Kopiere Startscript ==="
              if [ -f "/workspace/Nazi Zombies.sh" ]; then
                cp "/workspace/Nazi Zombies.sh" "$RELEASE_DIR/Nazi Zombies.sh"
                chmod +x "$RELEASE_DIR/Nazi Zombies.sh"
                echo "OK: Nazi Zombies.sh kopiert."
              else
                echo "WARNUNG: Nazi Zombies.sh nicht im Repo-Root gefunden."
              fi
            '

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzportable-rk3326-kmsdrm
          path: |
            engine/release/nzportablearm64
            engine/release/nzportablearm64.db
            engine/release/libSDL2-2.0.so.0
            engine/release/libSDL2-2.0.so
            engine/release/mali-hook/**
            engine/release/Nazi Zombies.sh
          if-no-files-found: error
