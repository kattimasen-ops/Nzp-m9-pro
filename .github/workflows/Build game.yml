name: NZP (nzp-team/fteqw) PortMaster Build (linux_armhf / RK3326)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FTE_TARGET: linux_armhf
  FTE_CONFIG: nzportable
  # ACHTUNG: CPUOPTIMIZATIONS wurde nur im Wrapper-Skript des Upstream-FTE-Projekts
  # gesehen (fte-team/fteqw/build_wip.sh), NICHT im Makefile selbst verifiziert.
  # Im Build-Log unten wird die tatsächliche Compiler-Kommandozeile ausgegeben -
  # prueft dort, ob -march=armv7-a etc. wirklich ankommt. Falls nicht, muesst ihr
  # ins engine/Makefile schauen, wie CFLAGS dort tatsaechlich injiziert werden.
  CPU_FLAGS: "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -O3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout nzp-team/fteqw (die tatsächliche Engine-Quelle)
        uses: actions/checkout@v4
        with:
          repository: nzp-team/fteqw
          submodules: recursive

      - name: Cross-Build in Ubuntu 20.04 Container (glibc-Kompatibilität zum Gerät)
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e FTE_TARGET="${FTE_TARGET}" -e FTE_CONFIG="${FTE_CONFIG}" -e CPU_FLAGS="${CPU_FLAGS}" \
            ubuntu:20.04 bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              echo "===== Konfiguriere ARMhf Quellen (Ubuntu 20.04 / focal) ====="
              dpkg --add-architecture armhf
              cp /etc/apt/sources.list /etc/apt/sources.list.bak
              cat > /etc/apt/sources.list << EOF
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ focal-security main restricted universe multiverse

          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ focal-security main restricted universe multiverse
          EOF

              for i in 1 2 3; do
                apt-get update && break
                echo "apt-get update fehlgeschlagen, Versuch $i/3 ..."
                sleep 5
              done

              # HINWEIS: zlib/libpng/libjpeg/libvorbis baut "make makelibs" selbst -
              # daher hier NICHT per apt installiert. Die restliche Liste ist eine
              # plausible Basis (SDL2 fuers Fenster/Input, GL/X11, curl) - falls der
              # Build "missing package X" meldet, hier ergaenzen. Die verlaesslichste
              # Referenz waere nzp-team/tools/fteqw-docker.
              apt-get install -y --no-install-recommends \
                build-essential make git curl ca-certificates pkg-config perl \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
                libsdl2-dev:armhf libsdl2-mixer-dev:armhf libsdl2-image-dev:armhf libsdl2-ttf-dev:armhf \
                libgl1-mesa-dev:armhf libx11-dev:armhf libcurl4-openssl-dev:armhf zlib1g-dev:armhf

              cd source/engine

              echo "===== make makelibs (laedt/baut zlib, libpng, libjpeg, libvorbis selbst) ====="
              make makelibs FTE_TARGET=${FTE_TARGET}

              echo "===== Eigentlicher Build ====="
              CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++ \
                make m-rel FTE_TARGET=${FTE_TARGET} FTE_CONFIG=${FTE_CONFIG} \
                CPUOPTIMIZATIONS="${CPU_FLAGS}" -j"$(nproc)"
            '

      - name: Locate and package binary
        run: |
          set -euo pipefail
          mkdir -p dist/nzportable

          # Der exakte Name/Pfad der fertigen Binary ist nicht offiziell dokumentiert -
          # daher robuste Suche statt fixem Pfad (wie schon beim REDRIVER2-Workflow).
          BIN=$(find source/engine -maxdepth 4 -type f -executable \
                \( -iname "*armhf*" -o -iname "fteqw*" -o -iname "*nzportable*" \) \
                ! -iname "*.sh" | head -n1)

          if [ -z "${BIN}" ]; then
            echo "::error::Keine armhf-Binary gefunden. Vorhandene ausfuehrbare Dateien:"
            find source/engine -maxdepth 4 -type f -executable
            exit 1
          fi

          echo "Gefunden: ${BIN}"
          file "${BIN}" || true
          cp "${BIN}" dist/nzportable/nzportable

          echo "Fertiger Inhalt:"
          ls -la dist/nzportable/

      - name: Upload PortMaster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NZP-PortMaster-armhf
          path: dist/nzportable/
          if-no-files-found: error
